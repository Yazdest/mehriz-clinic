<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b5566">
<title>پنل مدیریت | درمانگاه فرهنگیان مهریز</title>
<script>try{var t=localStorage.getItem("mh_adm_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef7f9;--card:#fff;--ink:#0c3340;--mut:#587780;--line:#d3e8ee;--p:#1a96ae;--pd:#0d6c80;--dd:#0b5566;--pl:#e0f6fa;--btn:#0d6c80;--onbtn:#fff;--br:#c0553d;--err:#b3261e;--errbg:#fdecec;--ok:#17713a;--okbg:#e6f6ec;--warn:#7a4f00;--warnbg:#fff4d6;--zebra:#f6fbfc;--hov:#eaf8fb;--hd:#0b5566;--sh:0 14px 34px -22px #0d6c80aa}
[data-theme=dark]{--bg:#0d1a1f;--card:#14272e;--ink:#e4f2f5;--mut:#93b1b9;--line:#26434c;--p:#38b6cc;--pd:#7fd3e3;--dd:#08303a;--pl:#173a43;--btn:#38b6cc;--onbtn:#03222a;--br:#e58a72;--err:#ff9b93;--errbg:#3b1f1f;--ok:#6fd392;--okbg:#16301f;--warn:#f1c35d;--warnbg:#38300f;--zebra:#112228;--hov:#183941;--hd:#08303a;--sh:0 14px 34px -22px #000}
*{box-sizing:border-box;margin:0}
html{font-size:16px}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pd)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
.only-print{display:none}

/* ---- ورود ---- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--dd),var(--pd) 60%,var(--p))}
.login{width:min(420px,100%);background:var(--card);border-radius:26px;padding:34px 30px;box-shadow:0 40px 70px -30px #000a;text-align:center}
.login .lock{width:64px;height:64px;border-radius:20px;background:var(--pl);color:var(--pd);display:grid;place-items:center;margin:0 auto 14px}
.login h1{font-size:1.35rem;color:var(--pd);font-weight:800}
.login p{color:var(--mut);margin:4px 0 20px;font-size:.95rem}
.login input{width:100%;min-height:54px;border:2px solid var(--line);border-radius:14px;padding:0 16px;background:var(--bg);margin-bottom:12px;text-align:center;letter-spacing:.1em}
.login input:focus{border-color:var(--p);outline:0;box-shadow:0 0 0 4px #30a8c033}
.login .err{color:var(--err);margin-top:12px;font-weight:500;min-height:1.6em}

/* ---- قاب اصلی ---- */
.top{position:relative;z-index:30;background:var(--hd);color:#e7f7fa}
.top-in{max-width:1320px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:1.1rem;font-weight:800;color:#fff}
.top .sub{font-size:.85rem;opacity:.8}
.top .sp{flex:1}
.today{background:#ffffff1c;padding:4px 14px;border-radius:999px;font-weight:500;font-size:.92rem;white-space:nowrap}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.icon-btn:hover{background:#ffffff2a}
.tabs-bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs{max-width:1320px;margin:auto;padding:8px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:8px 18px;border-radius:12px;font-weight:500;color:var(--mut);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{background:var(--hov);color:var(--pd)}
.tab.on{background:var(--btn);color:var(--onbtn);font-weight:700}
.tab .cnt{background:var(--br);color:#fff;border-radius:999px;font-size:.75rem;min-width:24px;height:22px;padding:0 7px;display:inline-grid;place-items:center;line-height:1}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--br)}
main{max-width:1320px;margin:auto;padding:18px 14px 60px}

/* ---- اجزا ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--pd);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--p);background:var(--hov)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--btn)}
.btn.danger{color:var(--err);border-color:var(--err);background:none}
.btn.danger:hover:not(:disabled){background:var(--errbg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.armed{background:var(--err);border-color:var(--err);color:#fff}
.field,.sel{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);max-width:100%}
.field:focus,.sel:focus{border-color:var(--p);outline:0;box-shadow:0 0 0 4px #30a8c030}
.field.bad,.sel.bad{border-color:var(--err);background:var(--errbg)}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:right}
.mut{color:var(--mut)}.sm{font-size:.85rem}.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.cx{background:var(--errbg);color:var(--err)}
.badge.off{background:var(--warnbg);color:var(--warn)}
.badge.new{background:var(--br);color:#fff}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:0 13px;min-height:40px;font-weight:500;color:var(--mut)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button:hover{background:var(--hov)}
.seg button.on{background:var(--btn);color:var(--onbtn);font-weight:700}
.notice{border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.info{background:var(--pl);color:var(--pd)}
.notice.err{background:var(--errbg);color:var(--err)}
.notice .sp{flex:1}
.empty{padding:46px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;font-size:1.1rem;color:var(--ink);margin-bottom:4px}

/* آمار */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px 18px;text-align:right;cursor:pointer;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);transition:.15s}
.stat:hover{transform:translateY(-2px);border-color:var(--p)}
.stat.on{border-color:var(--p);box-shadow:0 0 0 3px #30a8c033}
.stat small{display:block;color:var(--mut)}
.stat strong{font-size:1.9rem;line-height:1.3;color:var(--pd);font-weight:800}
.stat strong i{font-style:normal;font-size:.9rem;color:var(--mut);font-weight:500;margin-inline-start:6px}

/* نوار ابزار */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin-bottom:12px}
.toolbar .sp{flex:1}
.toolbar .field{min-width:170px}

/* جدول */
.tbl{overflow:auto;border-radius:18px;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.95rem}
th{background:var(--pl);color:var(--pd);text-align:right;font-weight:700;padding:10px 12px;position:sticky;top:0;z-index:2;white-space:nowrap;border-bottom:2px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--hov)}
tr.grp td{background:var(--dd)!important;color:#fff;font-weight:700;padding:9px 14px;position:sticky;top:41px;z-index:1}
tr.grp .gm{margin-inline-start:14px;font-weight:400;opacity:.9}
tr.grp .gc{float:left;font-weight:400;opacity:.9}
tr.cx td{opacity:.6}
tr.cx td.tm,tr.cx td b{text-decoration:line-through}
tr.new td{background:#fff3c4!important;color:#3d2c00}
[data-theme=dark] tr.new td{background:#4a3d12!important;color:#ffe9a8}
tr.past td{opacity:.5}
td.tm{font-weight:800;color:var(--pd);font-size:1.05rem;white-space:nowrap}
td.act{white-space:nowrap;text-align:left}
td input.field,td select.sel{width:100%;min-width:90px;min-height:40px}
td .field.w-id{min-width:110px}
.res-head{display:flex;justify-content:space-between;gap:10px;padding:2px 4px 10px;color:var(--mut);flex-wrap:wrap}

/* ویرایشگرها */
.help{padding:14px 18px;margin-bottom:12px;background:var(--pl);color:var(--ink);border-radius:14px;font-size:.93rem}
.help b{color:var(--pd)}
.help ul{margin:4px 0 0;padding-inline-start:20px}
.edbar{position:sticky;bottom:0;z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 -8px 24px -14px #0d6c80aa}
.edbar .sp{flex:1}
.dirty{color:var(--br);font-weight:700}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.wk{padding:0;overflow:hidden}
.wk header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--pl)}
.wk header b{color:var(--pd);font-size:1.05rem}
.wk header .sp{flex:1}
.shifts{padding:10px 14px 14px;display:grid;gap:8px}
.shift{display:grid;grid-template-columns:1.1fr 1fr auto 1fr auto;gap:8px;align-items:center}
.shift .sel{min-height:40px;padding:0 8px;width:100%}
.shift span{color:var(--mut);font-size:.9rem}
.iconx{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--err);font-size:1.15rem}
.iconx:hover{background:var(--errbg)}
.iconm{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.iconm:hover:not(:disabled){border-color:var(--p);color:var(--pd)}.iconm:disabled{opacity:.3}
.sw{position:relative;display:inline-block;width:50px;height:28px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:99px;background:#9bb3b9;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{right:25px}
.sw input:focus-visible+i{outline:3px solid var(--p);outline-offset:2px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.setc{padding:18px 20px}
.setc label{display:block;font-weight:700;color:var(--pd);margin-bottom:2px}
.setc p{color:var(--mut);font-size:.88rem;margin-bottom:10px}
.setc .field{width:140px;text-align:center;font-size:1.2rem;font-weight:700}

/* اعلان */
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dd);color:#fff;padding:12px 22px;border-radius:14px;box-shadow:0 20px 40px -14px #000a;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{background:var(--ok);color:#fff}[data-theme=dark] #toast.ok{color:#03210f}
#toast.err{background:var(--err);color:#fff}[data-theme=dark] #toast.err{color:#2a0603}
.spin{width:18px;height:18px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .top-in{padding:8px 12px;gap:8px}.top h1{font-size:1rem}.top .sub{display:none}.hide-m{display:none!important}.icon-btn{height:36px;min-width:36px;padding:0 10px;font-size:.82rem}.today{font-size:.82rem;padding:2px 10px}
  .stat{padding:10px 14px}.stat strong{font-size:1.5rem}
  .toolbar .field{min-width:0;flex:1 1 100%}
  .shift{grid-template-columns:1fr 1fr auto 1fr auto}
  .wkgrid{grid-template-columns:1fr}
  .tbl{max-height:none}
  tr.grp td{top:0}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;font-size:11pt}
  .top,.tabs-bar,.toolbar,.stats,.notice,.edbar,.noprint,#toast,.res-head .noprint{display:none!important}
  main{padding:0;max-width:none}
  .card,.tbl{box-shadow:none;border:0;max-height:none;overflow:visible}
  .only-print{display:block;margin-bottom:10px}
  .only-print h2{font-size:15pt}
  th{position:static;background:#e8e8e8!important;color:#000}
  tr.grp td{position:static;background:#333!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{background:#fff!important;color:#000!important}
  tr.new td{background:#fff!important}
  tr{break-inside:avoid}
}

/* ===== v16: بازطراحی ظاهر و تجربهٔ کاربری ===== */
@media screen{
.top{background:linear-gradient(120deg,var(--dd),var(--hd) 55%,#0f7a8f)}
.brand{flex:none;width:44px;height:44px;border-radius:14px;background:#ffffff1f;border:1px solid #ffffff3a;display:grid;place-items:center;color:#fff}
.brand svg{width:22px;height:22px}
.tabs-bar{backdrop-filter:blur(8px);background:color-mix(in srgb,var(--card) 90%,transparent)}
.tab{gap:8px;padding:9px 16px}
.tab svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{box-shadow:0 8px 18px -10px var(--btn)}
.card{border-radius:16px}
.btn{border-width:1.5px}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{box-shadow:0 8px 16px -10px var(--btn)}
.stat{--ac:#1a96ae;padding:14px 18px;box-shadow:inset -4px 0 0 var(--ac)}
.stat.on{box-shadow:inset -4px 0 0 var(--ac),0 0 0 3px #30a8c033}
.stat strong{color:var(--ac)}
.stat:nth-child(2){--ac:#6a73d9}.stat:nth-child(3){--ac:#2f9e75}.stat:nth-child(4){--ac:#d0584a}
[data-theme=dark] .stat:nth-child(2){--ac:#a0a8ff}[data-theme=dark] .stat:nth-child(3){--ac:#6fd3a8}[data-theme=dark] .stat:nth-child(4){--ac:#ff9b8f}
tr.grp td{background:var(--pl)!important;color:var(--pd);border-inline-start:5px solid var(--p);border-bottom:1px solid var(--line)}
tr.grp .gc{background:var(--card);border-radius:999px;padding:0 12px;font-weight:700;opacity:1}
.badge.ok::before,.badge.cx::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.edbar{backdrop-filter:blur(8px)}
.empty{padding:56px 20px}
.empty::before{content:"";display:block;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle,var(--card) 0 28%,var(--pl) 30%)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* نوبت‌ها روی موبایل: هر ردیف یک کارت */
@media screen and (max-width:760px){
#bkRes .tbl{border:0;box-shadow:none;background:none;overflow:visible}
#bkRes table,#bkRes tbody{display:block}
#bkRes thead{display:none}
#bkRes tr.grp{display:block;margin:14px 0 8px;border-radius:12px;overflow:hidden}
#bkRes tr.grp td{display:block}
#bkRes tr:not(.grp){display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
#bkRes tr.new:not(.grp){background:#fff3c4}
[data-theme=dark] #bkRes tr.new:not(.grp){background:#4a3d12}
#bkRes tr:not(.grp) td{display:block;padding:0;border:0;background:none!important}
#bkRes td:nth-child(1){grid-row:1;font-size:1.3rem}
#bkRes td:nth-child(2){grid-row:1}
#bkRes td:nth-child(3){grid-column:1/-1}
#bkRes td:nth-child(3) a{display:inline-flex;align-items:center;min-height:40px;font-weight:700}
#bkRes td:nth-child(4),#bkRes td:nth-child(7){display:none!important}
#bkRes td:nth-child(5){grid-column:1;grid-row:3}
#bkRes td:nth-child(6){grid-column:2;grid-row:3;justify-self:end}
#bkRes td:nth-child(8){grid-column:1/-1;margin-top:6px}
#bkRes td:nth-child(8) .btn{width:100%}
}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-top-color:transparent;opacity:.85;flex:none;vertical-align:-3px}
.btn[aria-busy]{cursor:progress}
.icon-btn .rf{display:inline-block}
.icon-btn.busy .rf{animation:sp .8s linear infinite}
.icon-btn:disabled{opacity:.75;cursor:progress}
.login input[readonly]{opacity:.7}
</style>
</head>
<body>

<!-- ورود -->
<div class="login-wrap" id="login">
  <form class="login" id="loginForm" autocomplete="on">
    <div class="lock"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>پنل مدیریت نوبت‌دهی</h1>
    <p>درمانگاه فرهنگیان مهریز</p>
    <input id="pw" type="password" placeholder="رمز مدیر" autocomplete="current-password" aria-label="رمز مدیر" required>
    <button class="btn primary" id="go" type="submit" style="width:100%;min-height:52px">ورود به پنل</button>
    <div class="err" id="lm" role="alert"></div>
  </form>
</div>

<!-- پنل -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <span class="brand" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 3.5h4V10h6.5v4H14v6.5h-4V14H3.5v-4H10z" fill="currentColor"/></svg></span><div><h1>پنل مدیریت نوبت‌دهی</h1><div class="sub">درمانگاه فرهنگیان مهریز</div></div>
    <span class="sp"></span>
    <span class="today" id="today"></span>
    <button class="icon-btn" id="refresh" type="button" title="دریافت آخرین اطلاعات از گوگل‌شیت"><span class="rf" aria-hidden="true">⟳</span> <span id="upd">به‌روزرسانی</span></button>
    <button class="icon-btn" id="theme" type="button" aria-label="تغییر حالت روشن/تیره" title="حالت روشن / تیره"><span style="font-size:1.15rem;line-height:1">◐</span><span class="hide-m" id="themeLbl"></span></button>
    <a class="icon-btn hide-m" href="index.html" target="_blank" rel="noopener" style="text-decoration:none">مشاهده سایت</a>
    <button class="icon-btn" id="logout" type="button">خروج</button>
  </div></header>
  <div class="tabs-bar"><nav class="tabs" id="tabs" aria-label="بخش‌های پنل"></nav></div>
  <main><div id="view"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script>
"use strict";
/* ================= ابزارها ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const FAD="۰۱۲۳۴۵۶۷۸۹";
const fa=s=>String(s??"").replace(/\d/g,d=>FAD[d]);
const en=s=>String(s??"").replace(/[۰-۹]/g,d=>FAD.indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const norm=s=>en(s).replace(/[\u200c\s]/g,"").replace(/ي/g,"ی").replace(/ك/g,"ک");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;
 let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g[gm-1];
 jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
 if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
 const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}

const jal=iso=>{const a=iso.split("-").map(Number),j=g2j(a[0],a[1],a[2]);return j[0]+"/"+p2(j[1])+"/"+p2(j[2])};

function validate(n,rows){
  const E=[],add=(r,c,m)=>E.push({r,c,msg:`ردیف ${fa(r+1)}: ${m}`}),empty=r=>r.every(c=>!String(c).trim());
  if(n===SN.DOC){const ids={};rows.forEach((r,i)=>{if(empty(r))return;const nm=String(r[0]).trim();
    if(!nm)add(i,0,"نام پزشک را وارد کنید");else if(ids[norm(nm)]!==undefined)add(i,0,"این نام پزشک تکراری است");else ids[norm(nm)]=i;
    if(!r[1])add(i,1,"گروه پزشک را انتخاب کنید")})}
  if(n===SN.WK)rows.forEach((r,i)=>{if(empty(r))return;if(!r[0])add(i,0,"پزشک انتخاب نشده");if(!DAYS.some(d=>norm(d)===norm(r[1])))add(i,1,"روز هفته را انتخاب کنید");
    const a=tmin(r[2]),b=tmin(r[3]);if(a===null)add(i,2,"ساعت شروع را انتخاب کنید");if(b===null)add(i,3,"ساعت پایان را انتخاب کنید");if(a!==null&&b!==null&&a>=b)add(i,3,"ساعت پایان باید بعد از شروع باشد")});
  if(n===SN.EX)rows.forEach((r,i)=>{if(empty(r))return;if(!jkey(r[0]))add(i,0,"تاریخ را انتخاب کنید");if(!r[1])add(i,1,"پزشک را انتخاب کنید");const t=norm(r[2]);
    if(!["لغو","اضافه","تغییرساعت"].includes(t))add(i,2,"نوع استثنا را انتخاب کنید");
    else if(t!=="لغو"){const a=tmin(r[3]),b=tmin(r[4]);if(a===null)add(i,3,"ساعت شروع را انتخاب کنید");if(b===null)add(i,4,"ساعت پایان را انتخاب کنید");if(a!==null&&b!==null&&a>=b)add(i,4,"ساعت پایان باید بعد از شروع باشد")}});
  if(n===SN.BLK)rows.forEach((r,i)=>{if(empty(r))return;const a=jkey(r[0]),b=jkey(r[1]);if(!a)add(i,0,"تاریخ شروع را انتخاب کنید");if(r[1]&&!b)add(i,1,"تاریخ پایان معتبر نیست");if(a&&b&&b<a)add(i,1,"تاریخ پایان قبل از شروع است");
    const x=tmin(r[3]),y=tmin(r[4]);if(r[3]&&x===null)add(i,3,"ساعت شروع معتبر نیست");if(r[4]&&y===null)add(i,4,"ساعت پایان معتبر نیست");if(x!==null&&y!==null&&x>=y)add(i,4,"ساعت پایان باید بعد از شروع باشد")});
  if(n===SN.SET){const mn=[1,1,1,0,1];rows.forEach((r,i)=>{const v=en(r[1]).trim();if(!/^\d+$/.test(v)||+v<(mn[i]??0))add(i,1,`«${r[0]}» باید عددی صحیح و حداقل ${fa(mn[i]??0)} باشد`)})}
  return E}

    if(keep.length===before)return toast("ردیف گذشته‌ای وجود ندارد.");draft[n]=keep;renderView();toast(fa(before-keep.length)+" ردیف گذشته حذف شد (برای ثبت نهایی ذخیره کنید).");return}
  if(a==="discard"){if(!confirm("همهٔ تغییرات ذخیره‌نشدهٔ این بخش برگردانده شود؟"))return;delete draft[n];renderView();return}
  if(a==="save")save(n)});

async function save(n){
  const rows=draft[n];if(!rows||!isDirty(n))return;
  const E=validate(n,rows);
  if(E.length){bad=E;renderView();toast(E[0].msg+(E.length>1?` (و ${fa(E.length-1)} مورد دیگر)`:""),"err");return}
  const btn=$("#btnSave");if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> در حال ذخیره…'}
  try{await api("asave",{sheet:n,rows:rows.map(r=>r.map(c=>String(c==null?"":c))),renames:n===SN.DOC?rows.filter(r=>r[9]&&String(r[0]).trim()&&norm(r[9])!==norm(r[0])).map(r=>[String(r[9]).trim(),String(r[0]).trim()]):[]});delete draft[n];await load();renderView();toast("در گوگل‌شیت ذخیره شد ✓","ok")}
  catch(e){toast(e.message,"err");if(btn){btn.disabled=false;btn.textContent="ذخیره در گوگل‌شیت"}}}
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&!$("#app").hidden){const n=curName();if(draft[n]){e.preventDefault();save(n)}}});
addEventListener("beforeunload",e=>{if(anyDirty()){e.preventDefault();e.returnValue=""}});

/* ================= به‌روزرسانی خودکار، تم ================= */
async function soft(manual){
  if(!T||$("#app").hidden)return;
  try{await load();renderTabs();if(view==="bk")renderBkDyn();else if(view==="usr"&&manual)renderView();if(manual)toast("اطلاعات به‌روز شد.","ok")}
  catch(e){if(manual)toast(e.message,"err")}}
$("#refresh").onclick=async e=>{const b=e.currentTarget;if(b.disabled)return;b.classList.add("busy");b.disabled=true;try{await soft(true)}finally{b.classList.remove("busy");b.disabled=false}};
setInterval(()=>{if(!document.hidden&&document.activeElement&&!/INPUT|SELECT/.test(document.activeElement.tagName))soft(false)},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)soft(false)});
const themeLbl=()=>{$("#themeLbl").textContent=document.documentElement.dataset.theme==="dark"?"حالت روشن":"حالت تیره"};themeLbl();
$("#theme").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("mh_adm_theme",t)}catch(e){}themeLbl()};

if(T)start();else showLogin();
</script>
</body>
</html>
